<style>
/* Layout: coluna única de celular (máx. 480px); topo com progresso em 7 trechos; arte no alto de cada pergunta; opções em cartões grandes; retorno da Chef em balão verde. */
:root {
  color-scheme: light;
  --brand: #064e3b;
  --brand-deep: #043f31;
  --brand-soft: #d9e8dc;
  --brand-tint: #eef6f0;
  --cta: #ea580c;
  --cta-hover: #c2410c;
  --cream: #fff7ed;
  --paper: #f7f8f5;
  --card: #ffffff;
  --ink: #1c1917;
  --muted: #57534e;
  --line: #e4e6e1;
  --wine: #8f1b1b;
  --on-brand: #ffffff;
  --on-brand-soft: #cfe5d6;
  --font: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg: 22px;
  --r-md: 16px;
  --shadow: 0 1px 2px rgba(6, 78, 59, .06), 0 8px 24px rgba(6, 78, 59, .07);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper);
}
.top {
  background: var(--paper);
  color: var(--ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 6px 0;
}
.top-in { max-width: 480px; margin: 0 auto; display: grid; gap: 8px; }
.brandrow { position: relative; display: flex; justify-content: center; }
.logo { display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 800; font-size: 14px; line-height: 1.2; letter-spacing: -.01em; text-align: center; }
.logo img { height: 58px; width: auto; filter: drop-shadow(0 6px 10px rgba(0,0,0,.18)); }
.logo span { color: var(--wine); }
.logo span em { font-style: normal; color: var(--cta); }
.back {
  position: absolute; left: 0; top: 0;
  appearance: none; border: 0; background: rgba(28,25,23,.06); color: var(--ink);
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
}
.back:hover { background: rgba(28,25,23,.12); }
.back svg { width: 18px; height: 18px; }
.progress { display: grid; gap: 8px; }
.progress-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--on-brand-soft); font-weight: 500; }
.progress-label b { color: var(--on-brand); font-weight: 700; }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.bars i { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; position: relative; }
.bars i::after { content: ""; position: absolute; inset: 0; background: var(--cta); transform: scaleX(0); transform-origin: left; transition: transform .45s ease; }
.bars i.on::after { transform: scaleX(1); }
.bars i.now::after { transform: scaleX(.5); }

main {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
.ready { color: var(--wine); font-size: clamp(24px, 6.6vw, 28px); }
.screen { max-width: 480px; margin: 14px auto 0; display: grid; gap: 14px; animation: in .4s ease both; }
@keyframes in { from { opacity: .001; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.art {
  position: relative; aspect-ratio: 1312 / 1199; max-width: 100%; justify-self: center;
  /* banner encolhe em tela baixa p/ o campo do nome e o botão caberem na 1ª tela */
  width: min(100%, calc(38vh * 1312 / 1199)); width: min(100%, calc(38svh * 1312 / 1199)); border-radius: var(--r-lg);
  overflow: hidden; background: var(--brand-tint); box-shadow: var(--shadow);
}
.art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph {
  position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px;
  text-align: center; padding: 18px; color: var(--brand);
  background:
    radial-gradient(120% 90% at 85% 0%, #fde7d3 0%, transparent 55%),
    radial-gradient(100% 80% at 0% 100%, var(--brand-soft) 0%, transparent 60%),
    var(--brand-tint);
  border: 2px dashed rgba(6, 78, 59, .25); border-radius: var(--r-lg);
}
.ph svg { width: 34px; height: 34px; opacity: .7; }
.ph b { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.ph span { font-size: 13px; color: var(--muted); max-width: 30ch; }

.q { display: grid; gap: 6px; text-align: center; justify-items: center; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--cta); }
h1 { margin: 0; font-size: clamp(22px, 6vw, 26px); line-height: 1.25; font-weight: 800; letter-spacing: -.015em; text-wrap: balance; color: var(--brand-deep); }
.sub { margin: 0; color: var(--muted); font-size: 15px; }

.opts { display: grid; gap: 10px; }
.opt {
  appearance: none; width: 100%; text-align: left; font: inherit; color: var(--ink);
  background: var(--card); border: 2px solid var(--line); border-radius: var(--r-md);
  padding: 14px 14px; display: grid; grid-template-columns: 34px 1fr 22px; align-items: center; gap: 12px;
  cursor: pointer; transition: border-color .15s, background .15s, transform .1s;
}
.opt:hover { border-color: #b9d3c1; }
.opt:active { transform: scale(.99); }
.opt .k {
  width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
  font-weight: 700; font-size: 14px; background: var(--brand-tint); color: var(--brand);
}
.opt .t { font-weight: 600; font-size: 15.5px; line-height: 1.35; min-width: 0; }
.opt .c { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.opt .c svg { width: 13px; height: 13px; opacity: 0; color: var(--on-brand); }
.opt.sel { border-color: var(--brand); background: var(--brand-tint); }
.opt.sel .k { background: var(--brand); color: var(--on-brand); }
.opt.sel .c { background: var(--brand); border-color: var(--brand); }
.opt.sel .c svg { opacity: 1; }

.field { display: grid; gap: 8px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); text-align: center; }
.field input {
  font: inherit; font-size: 18px; font-weight: 600; color: var(--ink);
  background: var(--card); border: 2px solid var(--line); border-radius: var(--r-md);
  padding: 15px 16px; width: 100%; outline: none; transition: border-color .15s; text-align: center;
}
.field input:focus { border-color: var(--brand); }
.field input::placeholder { color: #a8a29e; font-weight: 500; }

.fb {
  display: grid; justify-items: center; gap: 8px; text-align: center;
  background: var(--brand); color: var(--on-brand); border-radius: var(--r-lg);
  padding: 16px; animation: pop .35s ease both; position: relative;
}
@keyframes pop { from { opacity: .001; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
.ava { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: #fdba74; display: grid; place-items: center; position: relative; flex: none; }
.ava img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.ava b { font-size: 15px; color: var(--brand-deep); }
.fb small { display: block; font-size: 12px; font-weight: 600; color: var(--on-brand-soft); margin-bottom: 2px; }
.fb p { margin: 0; font-size: 15px; line-height: 1.5; font-weight: 500; }

.btn {
  appearance: none; border: 0; width: 100%; font: inherit; font-weight: 700; font-size: 17px;
  color: #fff; background: var(--cta); border-radius: var(--r-md); padding: 17px 20px;
  display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
  box-shadow: 0 6px 18px rgba(234, 88, 12, .32); transition: background .15s, transform .1s, opacity .15s;
}
a.btn { text-decoration: none; animation: pop .4s ease both, pulse 1.8s ease-in-out .4s infinite; }
.btn:hover { background: var(--cta-hover); }

    setTimeout(function () { buy.hidden = false; nao.hidden = false; conta('botoes'); }, BUY_DELAY_MS);
